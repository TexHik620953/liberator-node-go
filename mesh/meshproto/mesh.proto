syntax = "proto3";
package meshproto;
option go_package = "./meshproto";

import "google/protobuf/empty.proto";

//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative mesh/meshproto/mesh.proto

message PeerInfo {
    string id = 1;
    string addr = 2;
};

message ListKnownPeersResponse {
  repeated PeerInfo peers = 1;
}


service MeshService {
    rpc ListKnownPeers(google.protobuf.Empty) returns(ListKnownPeersResponse);
}

