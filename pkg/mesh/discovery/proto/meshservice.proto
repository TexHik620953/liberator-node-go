syntax = "proto3";
package proto;
import "google/protobuf/empty.proto";
option go_package = "./proto";
//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative pkg/mesh/meshservice/proto/meshservice.proto

enum PeerEventType {
    PEER_EVENT_SYNC = 0;
    PEER_EVENT_JOINED  = 1; // Новый узел в сети
    PEER_EVENT_UPDATED = 2; // Узел обновил статус (alive)
    PEER_EVENT_LEFT    = 3; // Узел отключился
}
message PeerInfo {
    string id = 1;
    string addr = 2;
    int64 last_seen = 3;
}
message PeerEvent {
    PeerEventType type = 1;
    PeerInfo update  = 2;
    repeated PeerInfo dump = 3;
}
service DiscoveryService {
    // Узел подписывается на поток изменений от соседа
    rpc SubscribePeers(google.protobuf.Empty) returns (stream PeerEvent);
}
