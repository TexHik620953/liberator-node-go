syntax = "proto3";
package proto;
import "google/protobuf/empty.proto";
option go_package = "./proto";
//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative pkg/mesh/peerssync/proto/peerssync.proto

enum ClientEventType {
    CLIENT_EVENT_SYNC    = 0;
    CLIENT_EVENT_ADDED   = 1;
    CLIENT_EVENT_REMOVED = 2;
}


message ClientInfo {
    string node_id       = 1;
    uint32 virtual_ip    = 2;
}
message ClientEvent {
    ClientEventType type = 1;
    ClientInfo update  = 2;
    repeated ClientInfo dump = 3;
}


enum ClientRuleEventType {
    CLIENT_RULE_EVENT_SYNC    = 0;
    CLIENT_RULE_EVENT_ADDED   = 1;
    CLIENT_RULE_EVENT_REMOVED = 2;
}


message ClientRule {
    string node_id = 1;
    uint64 id = 2;
    uint32 addr = 3;
    optional uint32 target_addr = 4;
    string protocol = 5;
    uint32 port_range_start = 6;
    optional uint32 port_range_end = 7;
}
message ClientRuleEvent {
    ClientRuleEventType type = 1;
    ClientRule update = 2;
    repeated ClientRule dump = 3;
}


service PeersSyncService {
    // Узел подписывается на поток изменений от соседа
    rpc SubscribeClients(google.protobuf.Empty) returns (stream ClientEvent);
    rpc SubscribeClientsRules(google.protobuf.Empty) returns (stream ClientRuleEvent);
}

