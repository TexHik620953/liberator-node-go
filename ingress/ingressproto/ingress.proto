syntax = "proto3";
package ingressproto;
option go_package = "./ingressproto";

import "google/protobuf/empty.proto";

//protoc --go_out=. --go_opt=paths=source_relative --go-grpc_out=. --go-grpc_opt=paths=source_relative ingress/ingressproto/ingress.proto


message AuthorizeRequest {
    string token = 1;
}
message AuthorizeResponse {
    bool ok = 1;
    optional string reason = 2;
}

service IngressService {
    rpc Authorize(AuthorizeRequest) returns(AuthorizeResponse);
}